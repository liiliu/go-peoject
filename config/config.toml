# ========================================
# 项目配置文件
# ========================================

[server]
# 应用标识
application = "YOUR_PROJECT"
# 项目名称
name = "your_project"
# 监听端口
port = 8080
# 调试模式
debug = false
# 运行环境 DEV/TEST/PROD
env = "DEV"
# 日志文件路径
logFileFolder = "./logs/log_error.log"
# 临时文件目录
tmpPath = "./tmp"

[mysqlMaster]
# 数据库连接DSN
# 格式：username:password@tcp(host:port)/database?charset=utf8mb4&parseTime=True&loc=Local
dsn = "root:Saisiyun0427@@tcp(gz-cynosdbmysql-grp-5ynx4q61.sql.tencentcdb.com:27739)/collab?charset=utf8mb4&parseTime=True&loc=Local"
# 最大空闲连接数
maxIdleConn = 10
# 最大打开连接数
maxOpenConn = 200
# 表名前缀
tablePrefix = "app_"
# 是否自动迁移数据库表结构
autoMigrate = true

[redis]
# Redis 地址
host = "106.55.181.113:6379"
# Redis 密码
password = "Saisiyun0427@"
# Redis 数据库索引
db = 0
# 空闲超时时间（秒）
idleTimeout = 300
# 连接池大小
poolSize = 100
# 最大连接存活时间（秒）
maxConnAge = 60
# 缓存键前缀
keyPrefix = "APP_DEV"

[jwt]
# JWT 加密密钥
secret = "your-secret-key-change-this-in-production"
# Token 过期时间（分钟）
expireTime = 1440  # 24小时
# 允许刷新时间（分钟）
maxRefreshTime = 10080  # 7天
